# Shared base fragment, deep-merged into every image config by scripts/render.sh.
# Lists are appended, maps are merged (image config wins on conflicts).
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - tzdata

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      shell: /sbin/nologin
  run-as: "65532"

environment:
  TZ: UTC
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.vendor: Kopexa
  org.opencontainers.image.source: https://github.com/kopexa-grc/images
  org.opencontainers.image.licenses: Apache-2.0
