name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Image and tag
      description: e.g. ghcr.io/kopexa-grc/php-apache:8.4.27
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Commands, values.yaml snippets, Dockerfile — whatever is needed.
      render: shell
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
