# Kopexa hardened Apache httpd configuration (mod_php, prefork MPM).
#
# Designed for containers:
#   - runs as an unprivileged user (no setuid, no privileged port)
#   - logs to stdout/stderr, writes runtime files to /tmp only
#   - works with a read-only root filesystem (mount /tmp as tmpfs/emptyDir)
#
# Tunables are environment variables with defaults set in the image
# (see images/php-apache/apko.yaml). Applications add their own vhost
# snippets in /etc/kopexa/httpd/conf.d/*.conf.

ServerRoot "/usr/lib/apache2"
ServerName localhost
Listen ${APACHE_LISTEN_PORT}

PidFile /tmp/httpd.pid
DefaultRuntimeDir /tmp
Mutex file:/tmp default

# --- Modules: only what is needed (CIS Apache 2.4 §2) ---------------------
LoadModule mpm_prefork_module    modules/mod_mpm_prefork.so
LoadModule unixd_module          modules/mod_unixd.so
LoadModule authz_core_module     modules/mod_authz_core.so
LoadModule authz_host_module     modules/mod_authz_host.so
LoadModule access_compat_module  modules/mod_access_compat.so
LoadModule alias_module          modules/mod_alias.so
LoadModule dir_module            modules/mod_dir.so
LoadModule mime_module           modules/mod_mime.so
LoadModule env_module            modules/mod_env.so
LoadModule setenvif_module       modules/mod_setenvif.so
LoadModule headers_module        modules/mod_headers.so
LoadModule expires_module        modules/mod_expires.so
LoadModule rewrite_module        modules/mod_rewrite.so
LoadModule remoteip_module       modules/mod_remoteip.so
LoadModule reqtimeout_module     modules/mod_reqtimeout.so
LoadModule filter_module         modules/mod_filter.so
LoadModule deflate_module        modules/mod_deflate.so
LoadModule log_config_module     modules/mod_log_config.so
LoadModule php_module            modules/libphp.so

# --- Information disclosure (CIS Apache 2.4 §8) ---------------------------
ServerTokens Prod
ServerSignature Off
TraceEnable Off
FileETag None
HostnameLookups Off
UseCanonicalName Off

# --- DoS mitigations (CIS Apache 2.4 §9, §10) -----------------------------
Timeout 60
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5
RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500
LimitRequestLine 8190
LimitRequestFields 100
LimitRequestFieldSize 8190

<IfModule mpm_prefork_module>
    StartServers             ${APACHE_START_SERVERS}
    MinSpareServers          ${APACHE_MIN_SPARE_SERVERS}
    MaxSpareServers          ${APACHE_MAX_SPARE_SERVERS}
    MaxRequestWorkers        ${APACHE_MAX_REQUEST_WORKERS}
    MaxConnectionsPerChild   ${APACHE_MAX_CONNECTIONS_PER_CHILD}
</IfModule>

# --- Logging to the container runtime (CIS Apache 2.4 §6) -----------------
ErrorLog /dev/stderr
LogLevel ${APACHE_LOG_LEVEL}
LogFormat "%a %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" %D" combined_rt
CustomLog /dev/stdout combined_rt env=!dontlog
SetEnvIf Request_URI "^/healthz$" dontlog

# --- Client IP behind ingress / gateway -----------------------------------
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy ${APACHE_TRUSTED_PROXIES}

# --- MIME / PHP handler ----------------------------------------------------
TypesConfig /etc/apache2/mime.types
DirectoryIndex index.php index.html
<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>

# --- Access control: deny by default (CIS Apache 2.4 §4, §5) --------------
<Directory />
    Options None
    AllowOverride None
    Require all denied
</Directory>

DocumentRoot "${APACHE_DOCUMENT_ROOT}"
<Directory "${APACHE_DOCUMENT_ROOT}">
    Options ${APACHE_DOCROOT_OPTIONS}
    AllowOverride ${APACHE_ALLOW_OVERRIDE}
    # Only common HTTP methods (CIS Apache 2.4 §5.7). Do not add a plain
    # "Require all granted" here: it would be OR-ed with the deny below.
    <Limit GET POST HEAD PUT PATCH DELETE OPTIONS>
        Require all granted
    </Limit>
    <LimitExcept GET POST HEAD PUT PATCH DELETE OPTIONS>
        Require all denied
    </LimitExcept>
</Directory>

# Never serve dotfiles (.htaccess, .env, .git, ...) or VCS metadata.
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
<DirectoryMatch "/\.(git|svn|hg)">
    Require all denied
</DirectoryMatch>

# --- Liveness endpoint, independent of the application --------------------
Alias /healthz /usr/share/kopexa/httpd/healthz
<Location /healthz>
    ForceType text/plain
</Location>
<Directory /usr/share/kopexa/httpd>
    Require all granted
</Directory>

# --- Security headers ------------------------------------------------------
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always unset X-Powered-By

AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript application/javascript application/json image/svg+xml

IncludeOptional /etc/kopexa/httpd/conf.d/*.conf
